<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Kad Prints">
  <rect width="64" height="64" rx="15" fill="#0866ff"/>
  <g fill="#ffffff">
    <!-- The bow, cut as a real hole so the mark works on any ground. -->
    <path fill-rule="evenodd"
          d="M33 32a12 12 0 1 1-24 0 12 12 0 0 1 24 0Zm-6.2 0a5.8 5.8 0 1 0-11.6 0 5.8 5.8 0 0 0 11.6 0Z"/>
    <!-- Stem and tooth, both square to the pixel grid: at 16px a diagonal
         stroke has to be anti-aliased the whole way and turns to mush. -->
    <rect x="26.75" y="27.75" width="29.5" height="8.5" rx="4.25"/>
    <rect x="41" y="28" width="8" height="20" rx="4"/>
  </g>
</svg>
